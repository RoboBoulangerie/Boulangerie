name: Suggest a correction to a croissant
description: Tell us what's wrong or missing. Fill in only what you know; leave the rest blank.
title: "Correction for "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! **Only fill in the boxes you want to change.** Anything you leave blank stays as it is.

        When you submit, we'll automatically prepare the change and link it here, so you can see exactly
        what will be updated before a person on our team publishes it.
  - type: input
    id: kb
    attributes:
      label: Which resource is this about?
      description: This is filled in for you if you came from your resource's page.
      placeholder: e.g. CIViC
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Which file or table? (if it's about one)
      description: Filled in for you if you came from a "Something wrong with this?" link.
  - type: dropdown
    id: relationship
    attributes:
      label: How are you connected to this resource?
      options:
        - I maintain or run it
        - I work on it
        - I use it
        - Other
    validations:
      required: true
  - type: textarea
    id: name
    attributes:
      label: Name
      description: The full name of your resource, as you'd like it shown.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short summary of what your resource contains. A paragraph from your homepage is perfect.
  - type: input
    id: license
    attributes:
      label: License
      description: The license your data is shared under, e.g. "CC BY 4.0", "CC0", or a link to your license page.
  - type: textarea
    id: citation
    attributes:
      label: How to cite
      description: The citation you'd like people to use, e.g. your main paper.
  - type: textarea
    id: access
    attributes:
      label: Access conditions
      description: Any rules people must follow to get the data (registration, a data use agreement, etc.). Leave blank if it's freely downloadable.
  - type: input
    id: version
    attributes:
      label: Current version or release
      description: e.g. "2026-09" or "v4.2".
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Missing files, files that shouldn't be listed, a better download page, or anything else. A person will read this.
