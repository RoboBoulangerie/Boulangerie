body:
- type: markdown
  attributes:
    value: 'Thanks for helping! **Only fill in the boxes you want to change.** Anything you leave blank stays as
      it is.


      When you submit, we''ll automatically prepare the change and link it here, so you can see exactly what will
      be updated before a person on our team publishes it.'
- type: input
