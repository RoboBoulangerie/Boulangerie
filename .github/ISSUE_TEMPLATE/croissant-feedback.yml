  attributes:
    label: How are you connected to this resource?
    options:
    - I maintain or run it
    - I work on it
    - I use it
    - Other
  validations:
    required: true
- type: textarea
  id: name
  attributes:
    label: Name
    description: The full name of your resource, as you'd like it shown.
  validations:
    required: false
- type: textarea
  id: description
  attributes:
    label: Description
    description: A short summary of what your resource contains. A paragraph from your homepage is perfect.
  validations:
    required: false
- type: input
  id: license
  attributes:
    label: License
    description: The license your data is shared under, e.g. "CC BY 4.0", "CC0", or a link to your license page.
  validations:
    required: false
- type: textarea
  id: citation
  attributes:
    label: How to cite
    description: The citation you'd like people to use, e.g. your main paper.
  validations:
    required: false
- type: textarea
  id: access
  attributes:
    label: Access conditions
    description: Any rules people must follow to get the data (registration, a data use agreement, etc.). Leave
      blank if it's freely downloadable.
