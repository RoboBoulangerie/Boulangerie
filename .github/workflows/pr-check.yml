# Check the croissants a pull request changes and post a summary on the PR.
name: Check pull request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen

      - uses: actions/cache/restore@v4
        with:
          path: results
          key: results-pr-${{ github.run_id }}
          restore-keys: results-

      - name: Find changed croissants
        id: changed
        run: |
          slugs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- kbs/ | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: uv run pytest -q

      - name: Check changed croissants
        if: steps.changed.outputs.slugs != ''
        run: uv run boulangerie check --kbs ${{ steps.changed.outputs.slugs }} --mlcroissant changed --fail-on-validator-errors

      - name: Summarize
        if: always() && steps.changed.outputs.slugs != ''
        run: uv run boulangerie pr-summary --kbs ${{ steps.changed.outputs.slugs }} --out summary.md

      - name: Comment on the pull request
        if: always() && steps.changed.outputs.slugs != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md
