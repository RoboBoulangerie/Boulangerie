[project]
name = "boulangerie"
version = "0.1.0"
description = "Serve and check Croissant metadata for biomedical knowledge bases"
authors = [
    { name = "Chris Bizon", email = "bizon@renci.org" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mlcroissant>=1.1.1",
    "requests>=2.34.2",
]

[project.scripts]
boulangerie = "boulangerie:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
